
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dashboard</title>

    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="dashboard">

    <header class="header">
        <h1>AI Dashboard</h1>
        <span class="model-name">GPT-4o-mini</span>
    </header>

    <main class="main-content">

        <section class="chat-section">

            <h2>Ask AI</h2>

            <textarea
                    id="promptInput"
                    placeholder="Ask me anything..."
                    rows="4">
                </textarea>

            <button id="sendButton">
                Send Message
            </button>

            <div id="loadingMessage" class="hidden">
                Generating response...
            </div>

            <div class="response-container">
                <h3>AI Response</h3>

                <div id="aiResponse">
                    Your AI response will appear here.
                </div>
            </div>

        </section>

        <section class="metrics-section">

            <h2>Usage Statistics</h2>

            <div class="metrics-grid">

                <div class="metric-card">
                    <h3>Prompt Tokens</h3>
                    <p id="promptTokens">-</p>
                </div>

                <div class="metric-card">
                    <h3>Completion Tokens</h3>
                    <p id="completionTokens">-</p>
                </div>

                <div class="metric-card">
                    <h3>Total Tokens</h3>
                    <p id="totalTokens">-</p>
                </div>

                <div class="metric-card">
                    <h3>Response Time</h3>
                    <p id="responseTime">-</p>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="/js/app.js"></script>

</body>
</html>
